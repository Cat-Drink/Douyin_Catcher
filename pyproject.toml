[project]
name = "douyin-catcher"
version = "0.2.2"
description = "抖音短视频（含图文、长视频）数据抓取的 Windows 桌面端应用"
authors = [{ name = "DouyinCatcher Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes
# W: pycodestyle warnings
# I: isort
# UP: pyupgrade
# B: flake8-bugbear
# SIM: flake8-simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # 测试中允许 assert
"*.spec" = ["F821", "UP009"]  # PyInstaller spec 文件的全局变量与编码声明

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=80"
markers = [
    "signer: 签名算法模块测试（crawlers/signer/）",
    "integration: 集成测试（需真实 Cookie，CI 默认跳过）",
    "slow: 耗时较长的性能测试（可选运行）",
]

[tool.coverage.run]
source = ["app", "crawlers", "downloader", "worker"]
omit = [
    "tests/*",
    "ui/*",
    "main.py",
    "crawlers/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
