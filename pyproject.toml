[project]
name = "douyin-catcher"
version = "0.0.1"
description = "抖音短视频（含图文、长视频）数据抓取的 Windows 桌面端应用"
authors = [{ name = "DouyinCatcher Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes
# W: pycodestyle warnings
# I: isort
# UP: pyupgrade
# B: flake8-bugbear
# SIM: flake8-simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # 测试中允许 assert

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "ui/*",
    "crawlers/*",
    "downloader/*",
    "worker/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
