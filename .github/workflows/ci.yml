# CI：代码质量与单元测试
#
# 触发：push 到 master / PR 到 master
# 内容：ruff 检查 + black 格式校验 + 前端 TypeScript 检查 + 单元测试 + 覆盖率
#
# 设计要点：
#   - Python 3.11 单版本（pyproject.toml requires-python >=3.11）
#   - windows-latest runner
#   - 用 -o addopts="" 清空 pyproject.toml 的 addopts，
#     覆盖率由命令行显式传参
#   - Codecov tokenless 上传（公开仓库，无需配 secret）

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同分支并发推送时取消旧的任务，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff 检查
        run: ruff check .

      - name: Black 格式校验
        run: black --check .

      - name: 单元测试
        # -o addopts="" 清空 pyproject.toml 的 addopts（含 --cov-fail-under=80），
        # 覆盖率参数由命令行显式传入
        shell: bash
        run: |
          pytest tests/ \
            -o addopts="" \
            --cov=. --cov-report=xml --cov-report=term-missing

      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-check:
    name: Frontend TypeScript Check
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 升级 npm（修复 optional 原生绑定缺失）
        # Vite 7 要求 Node 20.19+ / 22.12+，Node 22 满足要求；
        # Node 自带 npm 10 存在 optional 依赖不安装的 bug（npm/cli#4828），
        # 会导致 @tailwindcss/oxide 的原生绑定（如 win32-x64-msvc）丢失而构建失败
        run: npm install -g npm@11

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: TypeScript 类型检查
        run: |
          cd frontend
          npx tsc --noEmit

      - name: 前端构建
        run: |
          cd frontend
          npm run build